name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # A real Redis, not a mock: the conformance suite runs against both
    # backends so they cannot silently diverge.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Enforce coverage floor
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"line coverage: {rate:.2%}")
          sys.exit(0 if rate >= 0.85 else 1)
          PY
      - uses: actions/upload-artifact@v5
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: leaderboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image against Redis
        run: |
          docker network create lb-ci
          docker run -d --name redis --network lb-ci redis:7-alpine
          docker run -d --name api --network lb-ci -p 8080:8080 \
            -e LEADERBOARD_STORE_BACKEND=redis \
            -e LEADERBOARD_REDIS_URL=redis://redis:6379/0 \
            leaderboard:ci
          ./scripts/smoke.sh http://localhost:8080
      - name: Dump container logs on failure
        if: failure()
        run: docker logs api || true

  deploy:
    name: Deploy to DigitalOcean App Platform
    needs: [quality, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DO_APP_ID: ${{ secrets.DO_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Install doctl
        if: env.DO_APP_ID != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Trigger App Platform deployment
        # Skipped automatically until the repository has DO credentials set.
        if: env.DO_APP_ID != ''
        run: doctl apps create-deployment "$DO_APP_ID" --wait
