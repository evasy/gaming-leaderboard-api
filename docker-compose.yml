# Local production-shaped stack: the API talking to a real Redis.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api:
    build: .
    ports: ["8080:8080"]
    environment:
      LEADERBOARD_STORE_BACKEND: redis
      LEADERBOARD_REDIS_URL: redis://redis:6379/0
      LEADERBOARD_ENVIRONMENT: local
      LEADERBOARD_LOG_FORMAT: console
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
