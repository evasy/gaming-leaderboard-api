# DigitalOcean App Platform specification.
#
# Deploy:      doctl apps create   --spec .do/app.yaml
# Update:      doctl apps update <APP_ID> --spec .do/app.yaml
#
# The service is stateless; all leaderboard state lives in the managed Valkey
# cluster referenced below, which is what makes horizontal scaling and
# zero-downtime redeploys safe.
name: leaderboard-api
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: evasy/gaming-leaderboard-api
      branch: main
      # Deliberately off. App Platform's native auto-deploy fires the moment a
      # commit lands, in parallel with CI -- so a commit that fails tests would
      # still reach production. Deployment is instead driven by the `deploy`
      # job in .github/workflows/ci.yml, which runs `doctl apps
      # create-deployment` only after lint, types, the test matrix and the
      # image smoke test have all gone green.
      deploy_on_push: false

    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    # Two instances, so a rolling deploy never drops to zero capacity and the
    # "the API tier is stateless" claim is actually exercised rather than
    # asserted. Scaling out is a number change precisely because no request
    # depends on which instance served the previous one.
    #
    # CPU-metric autoscaling is the preferred setup but App Platform only
    # permits it on dedicated instances (apps-d-*); on the basic tier the spec
    # is rejected. The upgrade path is to swap the slug and replace
    # instance_count with:
    #   autoscaling:
    #     min_instance_count: 2
    #     max_instance_count: 6
    #     metrics: {cpu: {percent: 70}}
    instance_count: 2

    health_check:
      # readyz fails when Redis is unreachable, so App Platform will hold
      # traffic off an instance that cannot actually serve it.
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: LEADERBOARD_ENVIRONMENT
        value: production
      - key: LEADERBOARD_STORE_BACKEND
        value: redis
      - key: LEADERBOARD_LOG_FORMAT
        value: json
      - key: LEADERBOARD_LOG_LEVEL
        value: INFO
      - key: LEADERBOARD_DOCS_ENABLED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      # Bound to the managed database below; App Platform injects the real DSN.
      - key: LEADERBOARD_REDIS_URL
        scope: RUN_TIME
        value: ${leaderboard-redis.DATABASE_URL}


# Managed Valkey (DigitalOcean's Redis-compatible offering). Create it once,
# then App Platform injects the DSN into LEADERBOARD_REDIS_URL above:
#   doctl databases create leaderboard-redis --engine valkey \
#     --size db-s-1vcpu-1gb --region nyc3 --num-nodes 1
# Defaults are already correct for a leaderboard: noeviction (players are never
# dropped under memory pressure) and RDB persistence.
databases:
  - name: leaderboard-redis
    engine: VALKEY
    production: true
    cluster_name: leaderboard-redis

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Routing lives here rather than in the component's own `routes` block;
# App Platform rejects a spec that sets both.
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
